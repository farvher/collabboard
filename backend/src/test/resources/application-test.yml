spring:
  datasource:
    # Will be overridden by @DynamicPropertySource in AbstractIntegrationTest
    url: jdbc:postgresql://localhost:5432/collabboard_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 0

# JWT Configuration for tests
jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-minimum-32-chars
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# MinIO - will be overridden by @DynamicPropertySource in AbstractIntegrationTest
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: collabboard-test

logging:
  level:
    root: WARN
    com.collabboard: INFO
    org.testcontainers: INFO
