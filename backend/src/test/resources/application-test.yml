spring:
  datasource:
    url: jdbc:tc:postgresql:16:///collabboard_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 0

# JWT Configuration for tests
jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-minimum-32-chars
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# MinIO - will be overridden by Testcontainers
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: collabboard-test

logging:
  level:
    root: WARN
    com.collabboard: INFO
    org.testcontainers: INFO
