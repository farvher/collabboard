spring:
  datasource:
    # Cloud SQL connection via socket factory (Cloud Run auto-mounts the Unix socket)
    url: jdbc:postgresql:///${DB_NAME:collabboard}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&user=${DB_USER:collabboard}&password=${DB_PASSWORD}
    username: ${DB_USER:collabboard}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # Cloud Run sends SIGTERM, allow graceful shutdown
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# GCS Configuration
gcs:
  bucket-name: ${GCS_BUCKET_NAME:collabboard-505115-storage}

# CORS — restrict to actual frontend domain
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://collabboard-frontend-*.run.app}

# Logging for production
logging:
  level:
    root: WARN
    com.collabboard: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
